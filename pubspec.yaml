name: ringmaster_breeder
description: Herd management software for Rabbits and Cavies.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  appwrite: ^20.3.2

  cupertino_icons: ^1.0.8   # UI / Icons

  file_picker: ^10.3.8
  fl_chart: ^0.68.0   # Charts (Weight Graph)
  
  flutter:
    sdk: flutter
 
  image_picker: ^1.0.7
  intl: ^0.19.0

  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.2
  
  share_plus: ^7.2.1
  supabase_flutter: ^2.10.3   # Backend

  url_launcher: ^6.2.6
  


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets (enable when needed)
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Italic.ttf

  # Fonts (enable later if branding requires it)
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700