name: ringmaster_breeder
description: Herd management software for Rabbits and Cavies.
publish_to: 'none'

version: 0.26.0+260

environment:
  sdk: ^3.9.2

dependencies:

  cupertino_icons: ^1.0.8   # UI / Icons

  file_picker: ^10.3.8
  fl_chart: ^0.68.0   # Charts (Weight Graph)
  
  flutter:
    sdk: flutter
 
  intl: ^0.19.0

  http: 1.6.0

  xml: 6.6.1

  pdf: ^3.10.8
  printing: ^5.12.0
  
  supabase_flutter: ^2.10.3   # Backend

  url_launcher: ^6.2.6
  


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets (enable when needed)
  assets:
    - assets/images/ringmaster_breeder_logo_transparent.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Italic.ttf

  fonts:
    - family: BreederSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Italic.ttf
          style: italic
