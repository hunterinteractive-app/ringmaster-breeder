name: Deploy RingMaster Breeder
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: breeder-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build web
        run: flutter build web --release --pwa-strategy=none --dart-define=APP_VERSION=${{ github.sha }}
      - name: Verify cache headers
        run: test -f build/web/_headers && test -f build/web/flutter_bootstrap.js
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler@4 pages deploy build/web --project-name ringmaster-breeder --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
