name: Deploy RingMaster Breeder
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: breeder-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Verify offline job handlers
        run: |
          npx --yes deno@2 check supabase/functions/offline-jobs/index.ts supabase/functions/import-ringmaster-records/index.ts supabase/functions/billing/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/delete-account/index.ts
          npx --yes deno@2 test --allow-env supabase/functions/offline-jobs/core_test.ts supabase/functions/offline-jobs/handler_test.ts supabase/functions/billing/core_test.ts supabase/functions/billing/handler_test.ts supabase/functions/billing/overview_test.ts
      - name: Build web
        run: flutter build web --release --pwa-strategy=none --dart-define=OFFLINE_PILOT=true --dart-define=OFFLINE_FULL=true --dart-define=APP_VERSION=0.24.0
      - name: Package offline app
        run: python3 tool/prepare_offline_pilot.py build/web
      - name: Verify shared offline repository
        run: node tool/offline_workspace_test.cjs
      - name: Verify browser startup and keyboard recovery
        run: node tool/browser_compatibility_test.cjs
      - name: Verify cache headers
        run: test -f build/web/_headers && test -f build/web/flutter_bootstrap.js
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler@4 pages deploy build/web --project-name ringmaster-breeder --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
